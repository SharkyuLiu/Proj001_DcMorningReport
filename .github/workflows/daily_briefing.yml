name: Daily Briefing

on:
  schedule:
    - cron: '30 23 * * *'  # UTC 23:30 = 台北時間(UTC+8) 隔天早上 7:30
  workflow_dispatch:  # 允許手動觸發

jobs:
  briefing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Daily Briefing (含詳細 DEBUG 輸出)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PYTHONUNBUFFERED: 1
        run: python main.py
      
      - name: 📋 查看 DEBUG 日誌 (如果失敗)
        if: failure()
        run: |
          echo "=== 最新 DEBUG 日誌 ==="
          if [ -f logs/debug.log ]; then
            tail -100 logs/debug.log
          else
            echo "❌ 日誌文件不存在"
          fi
      
      - name: 📊 查看台股診斷日誌 (如果失敗)
        if: failure()
        run: python view_logs.py taiwan 2>/dev/null || echo "日誌查看失敗"
